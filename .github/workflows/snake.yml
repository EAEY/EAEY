name: Generate Snake Game

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: # allows manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: EAEY
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7,#c026d3,#e879f9&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a855f7,#c026d3,#e879f9&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
